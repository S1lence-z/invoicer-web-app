services:
    frontend:
        container_name: frontend
        build:
            context: .
            dockerfile: Frontend/Dockerfile
            args:
                DOTNET_VERSION: "8.0"
                BUILD_CONFIGURATION: Release
        ports:
            - "${FRONTEND_PORT:-5180}:80"
        environment:
            - API_BASE_URL=${API_BASE_URL}
            - APP_BASE_PATH=${APP_BASE_PATH}
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
        depends_on:
            - backend-api
        restart: unless-stopped

    backend-api:
        container_name: backend-api
        build:
            context: .
            dockerfile: Backend/Dockerfile
            args:
                DOTNET_VERSION: "8.0"
                BUILD_CONFIGURATION: Release
        ports:
            - "127.0.0.1:${BACKEND_PORT:-8180}:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
            - ASPNETCORE_URLS=http://+:8080
            - DatabaseProvider=${DatabaseProvider:-Sqlite}
            - ConnectionStrings__sqliteConnection=${ConnectionStrings__sqliteConnection:-Data Source=/data/Invoicer.db}
            - ConnectionStrings__pgsqlConnection=${ConnectionStrings__pgsqlConnection:-}
        volumes:
            - invoicer-data:/data
        restart: unless-stopped

volumes:
    invoicer-data:

# To connect to an external PostgreSQL instance on another Docker network:
# 1. Set DatabaseProvider=PostgreSql and ConnectionStrings__pgsqlConnection in .env
# 2. Add the external network:
#
# networks:
#   db-network:
#     external: true
#
# And attach it to the backend-api service:
#   backend-api:
#     networks:
#       - default
#       - db-network

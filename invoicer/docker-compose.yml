services:
    proxy:
        image: nginx:latest
        ports:
            - "127.0.0.1:${APP_PORT}:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - frontend
            - backend-api
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: Frontend/Dockerfile
            args:
                DOTNET_VERSION: "8.0"
                BUILD_CONFIGURATION: Release
        environment:
            - BASE_PATH=${BASE_PATH:-/}
            - API_BASE_URL=${API_BASE_URL:-}
        depends_on:
            - backend-api
        restart: unless-stopped

    backend-api:
        build:
            context: .
            dockerfile: Backend/Dockerfile
            args:
                DOTNET_VERSION: "8.0"
                BUILD_CONFIGURATION: Release
        environment:
            - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
            - ASPNETCORE_URLS=http://+:8080
            - DatabaseProvider=${DatabaseProvider:-Sqlite}
            - ConnectionStrings__sqliteConnection=${ConnectionStrings__sqliteConnection:-Data Source=/data/Invoicer.db}
            - ConnectionStrings__pgsqlConnection=${ConnectionStrings__pgsqlConnection:-}
        volumes:
            - invoicer-data:/data
        networks:
            - default
            - db_network
        restart: unless-stopped

volumes:
    invoicer-data:

networks:
    db_network:
        external: true

# To connect to an external PostgreSQL instance on another Docker network:
# 1. Set DatabaseProvider=PostgreSql and ConnectionStrings__pgsqlConnection in .env
# 2. Add the external network:
#
# networks:
#   db-network:
#     external: true
#
# And attach it to the backend-api service:
#   backend-api:
#     networks:
#       - default
#       - db-network

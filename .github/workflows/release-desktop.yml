name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: invoicer-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: invoicer-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact: invoicer-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: invoicer-osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Frontend (Blazor WASM)
        working-directory: invoicer
        run: dotnet publish Frontend/Frontend.csproj -c Release -o publish-frontend

      - name: Publish Desktop (self-contained)
        working-directory: invoicer
        run: >
          dotnet publish Desktop/Desktop.csproj
          -c Release
          --self-contained
          -r ${{ matrix.rid }}
          -p:DebugType=none
          -o publish-desktop

      - name: Copy Frontend wwwroot to publish output
        shell: bash
        run: |
          mkdir -p invoicer/publish-desktop/wwwroot
          cp -r invoicer/publish-frontend/wwwroot/* invoicer/publish-desktop/wwwroot/

      - name: Archive release
        shell: bash
        run: |
          cd invoicer/publish-desktop
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a -tzip ../../${{ matrix.artifact }}.zip .
          else
            tar czf ../../${{ matrix.artifact }}.tar.gz .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
